<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Core Glow & Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Shield Background -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Background Cyber Circuit Grid Lines -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1.5">
    <line x1="20" y1="40" x2="108" y2="40" />
    <line x1="20" y1="64" x2="108" y2="64" />
    <line x1="20" y1="88" x2="108" y2="88" />
    <line x1="40" y1="20" x2="40" y2="108" />
    <line x1="64" y1="20" x2="64" y2="108" />
    <line x1="88" y1="20" x2="88" y2="108" />
  </g>

  <!-- Industrial Plant / Smart Factory Graphic combined with Modern 'M' -->
  <!-- Factory Chimneys & Roof silhouette -->
  <g filter="url(#glow)">
    <!-- Factory Roof Sawtooth & Structures -->
    <path d="M 28 88 L 28 58 L 46 72 L 46 44 L 64 58 L 64 34 L 84 50 L 84 88 Z" 
          fill="url(#coreGrad)" 
          opacity="0.95" />

    <!-- Modern Dynamic "M" Geometric Wings -->
    <path d="M 24 88 L 44 38 L 64 68 L 84 38 L 104 88 L 88 88 L 76 56 L 64 76 L 52 56 L 40 88 Z" 
          fill="#ffffff" 
          opacity="0.9" />

    <!-- Base Tech Pedestal / Foundation -->
    <rect x="22" y="88" width="84" height="8" rx="4" fill="url(#coreGrad)" />
    
    <!-- Real-time Pulsing Status Indicator (Emerald Green LED) -->
    <circle cx="94" cy="34" r="8" fill="url(#accentGrad)" />
    <circle cx="94" cy="34" r="12" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6" />
    <circle cx="94" cy="34" r="4" fill="#ffffff" />
  </g>

  <!-- High-tech Node Connectors -->
  <circle cx="34" cy="92" r="2.5" fill="#ffffff" />
  <circle cx="64" cy="92" r="2.5" fill="#ffffff" />
  <circle cx="94" cy="92" r="2.5" fill="#ffffff" />
</svg>
